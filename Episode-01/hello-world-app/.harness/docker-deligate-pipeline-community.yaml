pipeline:
  name: devpipeline
  identifier: devpipeline

  projectIdentifier: HarnessCommunityDemo
  orgIdentifier: default

  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: account.dkgithub
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>

  stages:
    - stage:
        name: dev
        identifier: dev
        description: ""
        type: CI

        spec:
          cloneCodebase: true

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Docker
            spec: {}

          execution:
            steps:
              - step:
                  type: Run
                  name: Build Hello World
                  identifier: Build_Hello_World

                  spec:
                    image: maven:3.9-eclipse-temurin-21
                    shell: Sh

                    command: |-
                      echo "=== Building Hello World ==="

                      cd Episode-01/hello-world-app

                      echo "=== Java Version ==="
                      java -version

                      echo "=== Maven Version ==="
                      mvn -version

                      echo "=== Maven Build ==="
                      mvn clean package -q

                      echo "=== Running the App ==="

                      java -jar target/hello-world-1.0.0.jar

                      echo "=== Pipeline Success! ==="
                      echo "-- Happy Harness AI --"
