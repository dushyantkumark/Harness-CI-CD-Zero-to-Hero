pipeline:
  name: devpipelineecr
  identifier: devpipelineecr

  projectIdentifier: HarnessCICD
  orgIdentifier: default

  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: account.dkgithub
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>

  stages:
    - stage:
        name: Build and Scan
        identifier: Build_and_Scan
        description: ""
        type: CI

        spec:
          cloneCodebase: true

          caching:
            enabled: true
            override: true

          buildIntelligence:
            enabled: true

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Docker
            spec: {}

          execution:
            steps:

              # ==================================================
              # 1. TRIVY FILESYSTEM SCAN
              #    REPORT ONLY - DO NOT FAIL
              # ==================================================

              - step:
                  type: AquaTrivy
                  name: Trivy Filesystem Scan
                  identifier: Trivy_Filesystem_Scan

                  spec:
                    mode: orchestration
                    config: fs

                    target:
                      name: Harness-CI-CD-Zero-to-Hero
                      type: repository
                      variant: <+input>

                    advanced:
                      log:
                        level: info
                      fail_on_severity: none


              # ==================================================
              # 2. DOCKER BUILD
              #    IMAGE REMAINS IN DOCKER DAEMON
              # ==================================================

              - step:
                  type: Run
                  name: Build Docker Image
                  identifier: Build_Docker_Image

                  spec:
                    image: docker:28-cli
                    shell: Sh
                    privileged: true

                    command: |-
                      set -e

                      IMAGE_NAME="<+variable.AWS_ACCOUNT_ID>.dkr.ecr.<+variable.AWS_REGION>.amazonaws.com/<+variable.ECR_REPOSITORY>:<+codebase.commitSha>"

                      echo "=========================================="
                      echo "Docker Version"
                      echo "=========================================="

                      docker version

                      echo "=========================================="
                      echo "Image Name"
                      echo "=========================================="

                      echo "${IMAGE_NAME}"

                      echo "=========================================="
                      echo "Building Docker Image"
                      echo "=========================================="

                      docker build \
                        --pull \
                        -f "<+variable.DOCKERFILE_PATH>" \
                        -t "${IMAGE_NAME}" \
                        "<+variable.DOCKER_CONTEXT>"

                      echo "=========================================="
                      echo "Docker Image Created"
                      echo "=========================================="

                      docker images "${IMAGE_NAME}"

                      echo "=========================================="
                      echo "Docker Image ID"
                      echo "=========================================="

                      docker image inspect "${IMAGE_NAME}" \
                        --format '{{.Id}}'

                      echo "=========================================="
                      echo "Build Completed Successfully"
                      echo "=========================================="


              # ==================================================
              # 3. TRIVY IMAGE SCAN
              #    LOCAL DOCKER IMAGE
              #    REPORT ONLY - DO NOT FAIL
              # ==================================================

              - step:
                  type: AquaTrivy
                  name: Trivy Image Scan
                  identifier: Trivy_Image_Scan

                  spec:
                    mode: orchestration
                    config: default

                    target:
                      name: <+variable.ECR_REPOSITORY>
                      type: container
                      variant: <+codebase.commitSha>

                    advanced:
                      log:
                        level: info
                      fail_on_severity: none

                    privileged: true

                    image:
                      type: local_image
                      name: <+variable.ECR_REPOSITORY>
                      tag: <+codebase.commitSha>


              # ==================================================
              # 4. PUSH IMAGE TO ECR
              #    USE HARNESS AWS OIDC CONNECTOR
              # ==================================================

              - step:
                  type: BuildAndPushECR
                  name: Push Image to ECR
                  identifier: Push_Image_to_ECR

                  spec:
                    connectorRef: account.dkaws

                    region: <+variable.AWS_REGION>
                    account: <+variable.AWS_ACCOUNT_ID>

                    imageName: <+variable.ECR_REPOSITORY>

                    tags:
                      - <+codebase.commitSha>

                    envVariables:
                      PLUGIN_PUSH_ONLY: "true"
