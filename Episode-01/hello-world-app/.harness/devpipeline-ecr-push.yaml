pipeline:
  name: devpipelineecr
  identifier: devpipelineecr

  projectIdentifier: HarnessCICD
  orgIdentifier: default

  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: account.dkgithub
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>

  stages:

    # ================================================================
    # BUILD + SECURITY SCAN + ECR PUSH
    # ================================================================
    - stage:
        name: Build and Scan
        identifier: Build_and_Scan
        type: CI

        spec:
          cloneCodebase: true

          # ==========================================================
          # YOUR EC2 DOCKER RUNNER
          # ==========================================================
          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Docker
            spec: {}

          # Share Docker socket between steps
          sharedPaths:
            - /var/run

          execution:
            steps:

              # ======================================================
              # 1. TRIVY FILESYSTEM SCAN
              # ======================================================
              - step:
                  type: AquaTrivy
                  name: Trivy FS Scan
                  identifier: Trivy_FS_Scan

                  spec:
                    mode: orchestration
                    config: fs

                    target:
                      type: repository
                      name: Harness-CI-CD-Zero-to-Hero
                      variant: <+input>

                    advanced:
                      log:
                        level: info

                      # Report only
                      # Critical/High vulnerabilities will NOT fail pipeline
                      fail_on_severity: none

                    privileged: true


              # ======================================================
              # 2. BUILD DOCKER IMAGE
              # ======================================================
              - step:
                  type: Run
                  name: Build Docker Image
                  identifier: Build_Docker_Image

                  spec:
                    image: docker:28-cli
                    shell: Sh
                    privileged: true

                    command: |-
                      set -e

                      echo "=========================================="
                      echo "Docker Build"
                      echo "=========================================="

                      ECR_IMAGE="<+variable.AWS_ACCOUNT_ID>.dkr.ecr.<+variable.AWS_REGION>.amazonaws.com/<+variable.ECR_REPOSITORY>:<+codebase.commitSha>"

                      LOCAL_IMAGE="<+variable.ECR_REPOSITORY>:<+codebase.commitSha>"

                      echo "Docker Context : <+variable.DOCKER_CONTEXT>"
                      echo "Dockerfile     : <+variable.DOCKERFILE_PATH>"
                      echo "ECR Image      : ${ECR_IMAGE}"
                      echo "Local Image    : ${LOCAL_IMAGE}"

                      echo ""
                      echo "Docker version:"
                      docker version

                      echo ""
                      echo "Building Docker image..."

                      docker build \
                        --pull \
                        -f "<+variable.DOCKERFILE_PATH>" \
                        -t "${ECR_IMAGE}" \
                        "<+variable.DOCKER_CONTEXT>"

                      echo ""
                      echo "Creating local tag for Trivy..."

                      docker tag \
                        "${ECR_IMAGE}" \
                        "${LOCAL_IMAGE}"

                      echo ""
                      echo "=========================================="
                      echo "Docker Images"
                      echo "=========================================="

                      docker images | grep "<+variable.ECR_REPOSITORY>" || true

                      echo ""
                      echo "=========================================="
                      echo "ECR Image ID"
                      echo "=========================================="

                      docker image inspect "${ECR_IMAGE}" \
                        --format '{{.Id}}'

                      echo ""
                      echo "=========================================="
                      echo "Local Trivy Image ID"
                      echo "=========================================="

                      docker image inspect "${LOCAL_IMAGE}" \
                        --format '{{.Id}}'

                      echo ""
                      echo "=========================================="
                      echo "Image Tags"
                      echo "=========================================="

                      docker image inspect "${ECR_IMAGE}" \
                        --format '{{json .RepoTags}}'

                      echo ""
                      echo "Docker build completed successfully."


              # ======================================================
              # 3. TRIVY DOCKER IMAGE SCAN
              # ======================================================
              - step:
                  type: AquaTrivy
                  name: Trivy Image Scan
                  identifier: Trivy_Image_Scan

                  spec:
                    mode: orchestration
                    config: default

                    target:
                      type: container
                      name: <+variable.ECR_REPOSITORY>
                      variant: <+codebase.commitSha>

                    advanced:
                      log:
                        level: info

                      # Report only
                      # Do NOT fail pipeline on vulnerabilities
                      fail_on_severity: none

                    privileged: true

                    image:
                      type: local_image
                      name: <+variable.ECR_REPOSITORY>
                      tag: <+codebase.commitSha>


              # ======================================================
              # 4. PUSH SAME IMAGE TO ECR
              # ======================================================
              - step:
                  type: BuildAndPushECR
                  name: Push Image to ECR
                  identifier: Push_Image_to_ECR

                  spec:
                    connectorRef: account.dkaws

                    region: <+variable.AWS_REGION>

                    account: <+variable.AWS_ACCOUNT_ID>

                    imageName: <+variable.ECR_REPOSITORY>

                    tags:
                      - <+codebase.commitSha>

                    envVariables:
                      PLUGIN_PUSH_ONLY: "true"

                      PLUGIN_SOURCE_IMAGE: "<+variable.ECR_REPOSITORY>:<+codebase.commitSha>"
